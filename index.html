<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'">
    <title>Калькулятор баллов за СОЧ</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <button type="button" id="open-sor" class="secondary">Оценка за СОР ↗</button>
        <h1>Сколько баллов нужно за СОЧ?</h1>
        <p class="hint">ФО и СОР — вклад в итог четверти: каждый от 0 до 25.</p>
        <form id="soch-form" novalidate>
            <label for="grade">Какая оценка вам нужна</label>
            <select id="grade">
                <option value="4">4</option>
                <option value="5">5</option>
            </select>
            <label for="fo">Процент ФО</label>
            <input type="text" inputmode="decimal" id="fo">
            <label for="sor">Процент СОР</label>
            <input type="text" inputmode="decimal" id="sor">
            <label for="soch-max">Максимум баллов за СОЧ</label>
            <input type="text" inputmode="numeric" id="soch-max">
            <button type="submit" id="calculate">Отправить</button>
        </form>
        <p id="result" class="result" role="status" aria-live="polite">Здесь появится результат</p>
    </main>
    <script src="Расчет.js"></script>
</body>
</html>
